name: Final documentation precision check
on:
  push:
    branches: [maintenance/risk-documentation-2026-11-17]
    paths: [.github/workflows/documentation-final-review.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: maintenance/risk-documentation-2026-11-17
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: Apply two scientific wording corrections and refresh documentation hashes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from reproduce import verify_manifest
          verify_manifest()
          updates={
            'README.md':('For blocks of `b >= 2` independent and identically distributed (iid) observations,', 'For blocks of `b >= 2` independent and identically distributed (iid) observations with targets in the bounded predictor output interval,'),
            'experiments/controlled_calibration/README.md':('candidate feasible predictions','candidate prediction vectors'),
          }
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          audit_path=Path('validation/documentation_audit.json')
          audit=json.loads(audit_path.read_text())
          for name,(old,new) in updates.items():
              p=Path(name)
              s=p.read_text()
              assert s.count(old)==1,(name,old)
              s=s.replace(old,new)
              p.write_text(s)
              audit['documentation_files'][name]['words_after']=len(s.split())
              audit['documentation_files'][name]['bytes_after']=p.stat().st_size
          package=Path('experiments/controlled_calibration/manifest.json')
          data=json.loads(package.read_text())
          data['sha256']['README.md']=digest(package.parent/'README.md')
          package.write_text(json.dumps(data,indent=2)+'\n')
          root=Path('MANIFEST.json')
          manifest=json.loads(root.read_text())
          allowed=set(updates)|{str(package)}
          for row in manifest['files']:
              p=Path(row['path'])
              if row['path'] not in allowed:
                  assert p.stat().st_size==row['bytes'] and digest(p)==row['sha256'],row['path']
              row['bytes']=p.stat().st_size
              row['sha256']=digest(p)
          root.write_text(json.dumps(manifest,indent=2)+'\n')
          audit['source_manifest_sha256']=digest(root)
          audit['words_after']=sum(v['words_after'] for v in audit['documentation_files'].values())
          audit['final_wording_review']={'bounded_target_assumption_explicit':True,'unverified_prediction_candidates_not_called_feasible':True}
          audit_path.write_text(json.dumps(audit,indent=2)+'\n')
          verify_manifest()
          print(json.dumps(audit,indent=2))
          PY
      - name: Recompute all six groups and the worked example
        run: |
          if ! python reproduce.py --output "$RUNNER_TEMP/final-documentation-reproduction"; then
            find "$RUNNER_TEMP/final-documentation-reproduction" -name '*.log' -exec tail -n 100 {} \;
            exit 1
          fi
          python scripts/explain_bike_certificate.py --json > "$RUNNER_TEMP/final-example.json"
          python reproduce.py --help
      - name: Publish the verified documentation to the isolated branch
        run: |
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'final-documentation-reproduction'
          report=json.loads((src/'summary.json').read_text())
          assert report['status']=='PASS' and len(report['groups'])==6
          assert all(v['status']=='PASS' for v in report['groups'].values())
          audit=json.loads(Path('validation/documentation_audit.json').read_text())
          assert report['source_manifest']['sha256']==audit['source_manifest_sha256']
          shutil.copytree(src,Path('validation'),dirs_exist_ok=True)
          PY
          git rm .github/workflows/documentation-final-review.yml
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'State bounded-target assumption and preserve distinction between proposed and feasible predictions'
          remote_head=$(git ls-remote origin refs/heads/maintenance/risk-documentation-2026-11-17 | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/maintenance/risk-documentation-2026-11-17
