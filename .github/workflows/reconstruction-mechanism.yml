name: Reconstruction mechanism numerical checks
'on':
  push:
    paths:
    - extensions/reconstruction_mechanism/**
    - extensions/tmlr_integration/**
    - .github/workflows/reconstruction-mechanism.yml
  pull_request:
    paths:
    - extensions/reconstruction_mechanism/**
    - extensions/tmlr_integration/**
    - .github/workflows/reconstruction-mechanism.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: reconstruction-mechanism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg
jobs:
  scientific-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.14
        cache: pip
        cache-dependency-path: extensions/reconstruction_mechanism/requirements.txt
    - name: Restore exact mechanism and adaptive evidence from lossless parts
      run: python -m extensions.reconstruction_mechanism.evidence unpack
    - name: Install the specified numerical environment
      run: python -m pip install -r extensions/reconstruction_mechanism/requirements.txt
    - name: Check numerical, split and analysis contracts on simulated fixtures
      run: python -m unittest extensions.reconstruction_mechanism.test_models extensions.reconstruction_mechanism.test_inputs
        extensions.reconstruction_mechanism.test_analysis -v
    - name: Verify experimental source and input checksums
      run: python -m extensions.reconstruction_mechanism.run verify
    - name: Recompute complete-roster losses and all six fixed contrasts
      run: python -m extensions.reconstruction_mechanism.analyze --output "$RUNNER_TEMP/kahm-mechanism-analysis"
    - name: Independently reconstruct selected inference, selectors and statistics
      run: python -m extensions.reconstruction_mechanism.audit --analysis-json "$RUNNER_TEMP/kahm-mechanism-analysis/decision.json"
        --output "$RUNNER_TEMP/kahm-mechanism-independent-audit.json"
    - name: Build the saved-forecast verification bundle
      run: python extensions/tmlr_integration/package_tmlr_review.py --output-dir "$RUNNER_TEMP/kahm-tmlr-review"
    - name: Verify the extracted saved-forecast bundle
      run: |
        python - <<'PYCODE'
        import os
        from pathlib import Path, PurePosixPath
        import subprocess
        import sys
        import zipfile
        temporary = Path(os.environ['RUNNER_TEMP'])
        archive_path = temporary / 'kahm-tmlr-review' / 'KAHM_TMLR_Saved_Forecasts.zip'
        if archive_path.stat().st_size >= 100_000_000:
            raise SystemExit('The anonymous supplement exceeds the 100 MB limit')
        extracted = temporary / 'kahm-tmlr-review-extracted'
        extracted.mkdir()
        with zipfile.ZipFile(archive_path) as archive:
            names = archive.namelist()
            if len(names) != len(set(names)):
                raise SystemExit('The anonymous archive contains duplicate paths')
            for entry in archive.infolist():
                path = PurePosixPath(entry.filename)
                if (path.is_absolute() or '..' in path.parts
                        or path.parts[0] != 'saved_forecast_supplement'
                        or (entry.external_attr >> 16) & 0o170000 == 0o120000):
                    raise SystemExit('The anonymous archive contains an unsafe path')
            if archive.testzip() is not None:
                raise SystemExit('The anonymous archive failed its CRC check')
            archive.extractall(extracted)
        verifier = extracted / 'saved_forecast_supplement' / 'verify_saved_forecasts.py'
        subprocess.run([sys.executable, str(verifier), '--write-results',
                        str(temporary / 'kahm-tmlr-review-recomputed')], check=True)
        PYCODE
    - name: Replay every selected fitted model
      run: python -m extensions.reconstruction_mechanism.run replay
    - name: Verify complete evidence bindings and recomputed reports
      run: python -m extensions.reconstruction_mechanism.package_results audit
