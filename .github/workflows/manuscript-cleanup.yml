name: Align risk manuscript and verify retained experiments

on:
  push:
    branches:
      - maintenance/risk-manuscript-cleanup-2026-11-17

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - name: Check out the isolated cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: maintenance/risk-manuscript-cleanup-2026-11-17
          fetch-depth: 1
      - name: Set up the recorded Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install recorded replay dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply scoped cleanup and verify unchanged scientific inputs
        run: python .maintenance/align_manuscript.py
      - name: Recompute all six retained experiment groups
        run: python reproduce.py --output "$RUNNER_TEMP/reproduction_clean"
      - name: Check the worked example and reproduction entry point
        run: |
          python scripts/explain_bike_certificate.py --json > "$RUNNER_TEMP/bike_worked_example.json"
          python reproduce.py --help
          python - <<'PY'
          import reproduce
          assert len(reproduce.GROUPS) == 6
          assert 'affine_forecasting' not in reproduce.GROUPS
          assert 'single_trajectory_certification' not in reproduce.GROUPS
          print(reproduce.verify_manifest())
          PY
      - name: Record successful validation and commit only the scoped cleanup
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          import reproduce
          root = Path.cwd()
          tmp = Path(os.environ['RUNNER_TEMP'])
          results = tmp / 'reproduction_clean'
          summary = json.loads((results / 'summary.json').read_text())
          assert summary['status'] == 'PASS'
          assert set(summary['groups']) == set(reproduce.GROUPS)
          assert all(row['status'] == 'PASS' for row in summary['groups'].values())
          assert summary['source_manifest'] == reproduce.verify_manifest()
          shutil.copytree(results, root / 'validation')
          shutil.copy2(tmp / 'manuscript_cleanup_audit.json', root / 'validation/cleanup_audit.json')
          shutil.copy2(tmp / 'bike_worked_example.json', root / 'validation/bike_worked_example.json')
          subprocess.run(['git', 'add', '-A'], check=True)
          for group in reproduce.GROUPS:
              subprocess.run(['git', 'diff', '--cached', '--exit-code', '--', 'experiments/' + group], check=True)
          allowed = {'README.md', 'REPRODUCIBILITY.md', 'DATA.md', 'reproduce.py', 'MANIFEST.json', 'docs/EXPERIMENT_GUIDE.md', 'docs/MANUSCRIPT_ALIGNMENT.md', '.maintenance/align_manuscript.py', '.github/workflows/manuscript-cleanup.yml'}
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          unexpected = [p for p in changed if p not in allowed and not p.startswith(('experiments/affine_forecasting/', 'validation/'))]
          assert not unexpected, unexpected
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print(json.dumps({'status': 'PASS', 'groups': list(summary['groups']), 'changed_files': len(changed)}, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align risk manuscript repository with retained experiments; verify six groups'
          git push origin HEAD:refs/heads/maintenance/risk-manuscript-cleanup-2026-11-17
          git rev-parse HEAD
