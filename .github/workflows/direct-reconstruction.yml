name: Direct reconstruction evidence and manuscript

on:
  push:
    paths:
      - 'extensions/direct_reconstruction/**'
      - 'extensions/forecast_gate_pilot/**'
      - 'extensions/tmlr_integration/package_direct.py'
      - '.github/workflows/direct-reconstruction.yml'
  pull_request:
    paths:
      - 'extensions/direct_reconstruction/**'
      - 'extensions/forecast_gate_pilot/**'
      - 'extensions/tmlr_integration/package_direct.py'
      - '.github/workflows/direct-reconstruction.yml'
  workflow_dispatch:

# This historical workflow still checks changes to its own study and packager.
# Current-manuscript-only changes belong to reconstruction-mechanism.yml;
# they do not introduce a new CPU-sensitive replay gate for the old experiment.

permissions:
  contents: read

concurrency:
  group: direct-reconstruction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg

jobs:
  audit-and-build:
    # Match the archived interpreter and glibc generation for selected-state replay.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: extensions/direct_reconstruction/requirements.txt
      - name: Install declared numerical dependencies
        run: python -m pip install -r extensions/direct_reconstruction/requirements.txt
      - name: Record the numerical runtime for strict replay
        run: |
          python - <<'PY'
          import platform
          import numpy as np
          print(platform.platform())
          np.show_runtime()
          print('Frozen generator replay requires identical numerical dispatch; CPU differences are not silently tolerated.')
          PY
      - name: Check numerical contracts and chronological protocol
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python extensions/direct_reconstruction/test_model.py -v
          python extensions/direct_reconstruction/test_protocol.py
      - name: Restore exact execution files from lossless task archives
        run: >-
          python -m extensions.direct_reconstruction.evidence unpack
          --run-dir extensions/direct_reconstruction/results
      - name: Audit and replay saved selected models without forecast refits
        run: >-
          python extensions/direct_reconstruction/analyze.py
          extensions/direct_reconstruction/results --verify-live-source
      - name: Install the manuscript compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended latexmk lmodern poppler-utils
      - name: Compile the integrated research manuscript
        working-directory: extensions/tmlr_integration/manuscript
        run: |
          mkdir -p "$RUNNER_TEMP/kahm-direct-tex"
          latexmk -pdf -interaction=nonstopmode -halt-on-error -output-directory="$RUNNER_TEMP/kahm-direct-tex" main.tex
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'kahm-direct-tex'
          log = (output / 'main.log').read_text()
          if re.search(r'There were undefined (references|citations)|(?:LaTeX|Package natbib) Warning:.*undefined|Overfull \\[hv]box', log):
              raise SystemExit('Unresolved references, citations, or overflowing manuscript content')
          if not (output / 'main.pdf').is_file():
              raise SystemExit('Compiled manuscript missing')
          PY
      - name: Package editable manuscript and frozen evidence
        run: >-
          python -m extensions.tmlr_integration.package_direct build
          --pdf "$RUNNER_TEMP/kahm-direct-tex/main.pdf"
          --output "$RUNNER_TEMP/kahm-direct-release"
      - name: Upload the manuscript and reproducible evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kahm-direct-reconstruction-research
          path: ${{ runner.temp }}/kahm-direct-release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
