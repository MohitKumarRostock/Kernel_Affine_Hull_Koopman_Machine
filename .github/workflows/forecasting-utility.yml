name: Forecasting utility numerical checks
'on':
  push:
    paths:
    - extensions/forecasting_utility/**
    - extensions/tmlr_integration/**
    - examples/forecasting_utility.py
    - .github/workflows/forecasting-utility.yml
  pull_request:
    paths:
    - extensions/forecasting_utility/**
    - extensions/tmlr_integration/**
    - examples/forecasting_utility.py
    - .github/workflows/forecasting-utility.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: forecasting-utility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
jobs:
  scientific-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: extensions/forecasting_utility/requirements.txt
    - name: Install the pinned study environment and engineering test runner
      run: python -m pip install -r extensions/forecasting_utility/requirements.txt pytest==9.2.0
    - name: Run the 23 toy engineering tests
      run: python -m pytest extensions/forecasting_utility/test_models.py extensions/forecasting_utility/test_protocol.py
        -q
    - name: Restore the complete saved extension outcomes
      run: python -m extensions.forecasting_utility.reference restore
    - name: Verify all 168 attempts, 1,336 forecasts, eight model failures and four policy failures
      run: python -m extensions.tmlr_integration.package_utility audit
    - name: Independently recompute raw prediction losses, split pairing, intervals and source weights
      run: python -m extensions.forecasting_utility.independent_audit
