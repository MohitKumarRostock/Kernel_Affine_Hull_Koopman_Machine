name: Target geometry numerical checks
'on':
  push:
    paths:
    - extensions/target_geometry/**
    - extensions/tmlr_integration/package_target.py
    - extensions/tmlr_integration/package_utility.py
    - extensions/natural_forecasting/**
    - extensions/forecasting_utility/**
    - extensions/predictive_geometry/study/**
    - .github/workflows/target-geometry.yml
    - scripts/materialize_scientific_context.py
    - tests/test_materialize_scientific_context.py
  pull_request:
    paths:
    - extensions/target_geometry/**
    - extensions/tmlr_integration/package_target.py
    - extensions/tmlr_integration/package_utility.py
    - extensions/natural_forecasting/**
    - extensions/forecasting_utility/**
    - extensions/predictive_geometry/study/**
    - .github/workflows/target-geometry.yml
    - scripts/materialize_scientific_context.py
    - tests/test_materialize_scientific_context.py
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: target-geometry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
jobs:
  scientific-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: 3.12.14
        cache: pip
        cache-dependency-path: extensions/target_geometry/requirements.txt
    - name: Install the frozen numerical dependencies
      run: python -m pip install -r extensions/target_geometry/requirements.txt
    - name: Run the 28 fabricated-data engineering tests
      run: python -m unittest extensions.target_geometry.test_models extensions.target_geometry.test_protocol extensions.target_geometry.test_analysis
        -v
    - name: Check scientific context file identities and output protection
      run: python -B -m unittest discover -s tests -p 'test_materialize_scientific_context.py' -v
    - name: Materialize exact scientific verification inputs
      shell: bash
      run: |
        git fetch --no-tags --refetch --no-filter --depth=1 origin 5123365917ae630b684f8a3bebb0294ee695ce7a
        python scripts/materialize_scientific_context.py --output "$RUNNER_TEMP/kahm-target-context"
    - name: Verify the scientific freeze and prepared data boundaries
      run: |
        python -m extensions.target_geometry.freeze verify
        python -m extensions.target_geometry.data verify
      working-directory: ${{ runner.temp }}/kahm-target-context
    - name: Independently audit saved predictions into a temporary report directory
      run: python -m extensions.target_geometry.analysis --run-dir extensions/target_geometry/results/v1 --output "$RUNNER_TEMP/kahm-target-analysis"
      working-directory: ${{ runner.temp }}/kahm-target-context
    - name: Verify the public checkpoint and exact saved-report replay
      run: python -m extensions.tmlr_integration.package_target audit --run-dir extensions/target_geometry/results/v1 --reports-dir
        extensions/target_geometry/reports
      working-directory: ${{ runner.temp }}/kahm-target-context
