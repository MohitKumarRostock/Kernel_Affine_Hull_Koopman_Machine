name: Historical forecasting evidence integrity

on:
  push:
    paths:
      - 'extensions/tmlr_integration/package.py'
      - 'extensions/tmlr_integration/package_tests.py'
      - 'extensions/scaling_sensitivity/**'
      - '.github/workflows/tmlr-integration.yml'
  pull_request:
    paths:
      - 'extensions/tmlr_integration/package.py'
      - 'extensions/tmlr_integration/package_tests.py'
      - 'extensions/scaling_sensitivity/**'
      - '.github/workflows/tmlr-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmlr-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg

jobs:
  preserved-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: extensions/natural_forecasting/requirements.txt
      - name: Install pinned analysis dependencies
        run: python -m pip install -r extensions/natural_forecasting/requirements.txt
      - name: Restore both saved natural and sensitivity artifacts
        run: |
          python extensions/natural_forecasting/package.py restore-reference extensions/natural_forecasting/reference/natural_v1.zip.parts.json
          python -m extensions.scaling_sensitivity.reference restore
      - name: Check preserved source and review archive defenses
        run: |
          python extensions/tmlr_integration/package.py check-source
          python -m unittest extensions.tmlr_integration.package_tests -v
          python -m unittest extensions.scaling_sensitivity.test_natural extensions.scaling_sensitivity.test_controlled extensions.scaling_sensitivity.test_analysis extensions.scaling_sensitivity.test_reference -v
      - name: Restore and audit saved evidence without forecasting fits
        run: |
          python extensions/tmlr_integration/package.py audit .
      # The current revised manuscript and its complete new extension artifact
      # are compiled, checked and packaged by forecasting-utility.yml.
