name: Scientific repository integrity
on:
  push:
    branches:
      - paper/geometry-induced-soft-state-clean-2026-11-02
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and declared reference commits
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'MohitKumarRostock/Kernel_Affine_Hull_Koopman_Machine'
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          python3 scripts/verify_publication_tree.py --list-source-commits > "$RUNNER_TEMP/source-commits.txt"
          mapfile -t source_commits < "$RUNNER_TEMP/source-commits.txt"
          git -c protocol.version=2 fetch --filter=blob:none --depth=1 origin "${source_commits[@]}"
      - name: Check scientific files and documentation links
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -v
          python3 scripts/verify_publication_tree.py --output-dir "$RUNNER_TEMP/repository-check"
          echo '## Scientific file verification' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/repository-check/verification.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Install statistical verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/summary-env"
          "$RUNNER_TEMP/summary-env/bin/python" -m pip install --quiet -r reproduction/score_enrichment/requirements.txt
      - name: Recompute all forty primary-summary decisions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/summary-env/bin/python" extensions/score_enrichment_20261102/verify_primary_summary.py | tee "$RUNNER_TEMP/primary-summary-check.json"
          echo '## Primary-summary arithmetic' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/primary-summary-check.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Reconstruct central-study statistics from saved losses
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/summary-env/bin/python" reproduction/score_enrichment/check_saved_losses.py | tee "$RUNNER_TEMP/saved-loss-check.json"
          "$RUNNER_TEMP/summary-env/bin/python" -m unittest discover -s reproduction/score_enrichment/tests -v
          echo '## Central saved-loss reconstruction' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/saved-loss-check.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify predictor-capacity source and archive identities
        working-directory: reproduction/capacity_followup
        shell: bash
        run: |
          set -euo pipefail
          python3 -S -m reproduce verify | tee "$RUNNER_TEMP/capacity-identity-check.json"
          echo '## Predictor-capacity bundle identities' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/capacity-identity-check.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Check tracked files remain unchanged
        shell: bash
        run: git diff --exit-code
