name: Verify scientific documentation revision

on:
  push:
    branches:
      - maintenance/risk-documentation-2026-11-17
    paths:
      - .maintenance/rewrite_documentation.py
      - .github/workflows/documentation-revision.yml

permissions:
  contents: write

jobs:
  documentation-and-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - name: Check out the isolated documentation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: maintenance/risk-documentation-2026-11-17
          fetch-depth: 1
      - name: Set up the recorded Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the unchanged experiment dependencies
        run: python -m pip install -r requirements.txt
      - name: Revise documentation and verify scientific-file integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.maintenance/rewrite_documentation.py')
          s=p.read_text()
          s=s.replace('specified additional-cost criterion','specified comparison criterion')
          p.write_text(s)
          PY
          python .maintenance/rewrite_documentation.py
      - name: Recompute all six experiment groups
        run: python reproduce.py --output "$RUNNER_TEMP/risk-documentation-reproduction"
      - name: Verify the worked example and command-line help
        run: |
          python scripts/explain_bike_certificate.py --json > "$RUNNER_TEMP/risk-documentation-example.json"
          python reproduce.py --help
      - name: Record validation and remove one-time editing tools
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'risk-documentation-reproduction'
          report=json.loads((src/'summary.json').read_text())
          expected={'controlled_calibration','ecg_cohort','class_diagnosis','deployment_cost','public_screening','decoder_diagnostics'}
          assert report['status']=='PASS'
          assert set(report['groups'])==expected
          assert all(v['status']=='PASS' for v in report['groups'].values())
          audit=Path('validation/documentation_audit.json')
          data=json.loads(audit.read_text())
          assert report['source_manifest']['sha256']==data['source_manifest_sha256']
          data['numerical_reproduction_status']='PASS'
          data['validated_groups']=sorted(expected)
          data['worked_example_completed']=True
          shutil.copytree(src,Path('validation'),dirs_exist_ok=True)
          audit.write_text(json.dumps(data,indent=2)+'\n')
          PY
          git rm -f .maintenance/rewrite_documentation.py .github/workflows/documentation-revision.yml
          git add README.md REPRODUCIBILITY.md DATA.md docs experiments/*/README.md experiments/class_diagnosis/MANIFEST.json MANIFEST.json validation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use precise scientific terminology in paper documentation; verify all six groups'
          remote_head=$(git ls-remote origin refs/heads/maintenance/risk-documentation-2026-11-17 | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/maintenance/risk-documentation-2026-11-17
