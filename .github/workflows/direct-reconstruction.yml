name: Direct reconstruction numerical checks
'on':
  push:
    paths:
    - extensions/direct_reconstruction/**
    - extensions/forecast_gate_pilot/**
    - extensions/tmlr_integration/package_direct.py
    - .github/workflows/direct-reconstruction.yml
  pull_request:
    paths:
    - extensions/direct_reconstruction/**
    - extensions/forecast_gate_pilot/**
    - extensions/tmlr_integration/package_direct.py
    - .github/workflows/direct-reconstruction.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: direct-reconstruction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
jobs:
  scientific-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.14
        cache: pip
        cache-dependency-path: extensions/direct_reconstruction/requirements.txt
    - name: Install declared numerical dependencies
      run: python -m pip install -r extensions/direct_reconstruction/requirements.txt
    - name: Record the numerical runtime for strict replay
      run: |
        python - <<'PY'
        import platform
        import numpy as np
        print(platform.platform())
        np.show_runtime()
        print('Frozen generator replay requires identical numerical dispatch; CPU differences are not silently tolerated.')
        PY
    - name: Check numerical contracts and chronological protocol
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python extensions/direct_reconstruction/test_model.py -v
        python extensions/direct_reconstruction/test_protocol.py
    - name: Restore exact execution files from lossless task archives
      run: python -m extensions.direct_reconstruction.evidence unpack --run-dir extensions/direct_reconstruction/results
    - name: Audit and replay saved selected models without forecast refits
      run: python extensions/direct_reconstruction/analyze.py extensions/direct_reconstruction/results --verify-live-source
    - name: Audit saved evidence with its exact scientific source
      run: python -m extensions.tmlr_integration.package_direct audit --work-dir "$RUNNER_TEMP/kahm-direct-audit"
