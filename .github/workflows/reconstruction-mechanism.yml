name: KAHM TMLR manuscript and reconstruction evidence

on:
  push:
    paths:
      - 'extensions/reconstruction_mechanism/**'
      - 'extensions/tmlr_integration/**'
      - '.github/workflows/reconstruction-mechanism.yml'
  pull_request:
    paths:
      - 'extensions/reconstruction_mechanism/**'
      - 'extensions/tmlr_integration/**'
      - '.github/workflows/reconstruction-mechanism.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconstruction-mechanism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg

jobs:
  completed-evidence-and-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: extensions/reconstruction_mechanism/requirements.txt
      - name: Restore exact mechanism and adaptive evidence from lossless parts
        run: python -m extensions.reconstruction_mechanism.evidence unpack
      - name: Install the specified numerical environment
        run: python -m pip install -r extensions/reconstruction_mechanism/requirements.txt
      - name: Check numerical, split and analysis contracts on simulated fixtures
        run: >-
          python -m unittest extensions.reconstruction_mechanism.test_models
          extensions.reconstruction_mechanism.test_inputs
          extensions.reconstruction_mechanism.test_analysis -v
      - name: Verify experimental source and input checksums
        run: python -m extensions.reconstruction_mechanism.run verify
      - name: Recompute complete-roster losses and all six fixed contrasts
        run: >-
          python -m extensions.reconstruction_mechanism.analyze
          --output "$RUNNER_TEMP/kahm-mechanism-analysis"
      - name: Independently reconstruct selected inference, selectors and statistics
        run: >-
          python -m extensions.reconstruction_mechanism.audit
          --analysis-json "$RUNNER_TEMP/kahm-mechanism-analysis/decision.json"
          --output "$RUNNER_TEMP/kahm-mechanism-independent-audit.json"
      - name: Regenerate reconstruction and adaptation displays with scientific captions
        run: |
          python extensions/tmlr_integration/build_mechanism_assets.py
          python extensions/tmlr_integration/build_adaptive_assets.py
          python extensions/tmlr_integration/format_manuscript_assets.py
      - name: Install the manuscript compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended latexmk lmodern poppler-utils
      - name: Compile and check the anonymous TMLR manuscript
        working-directory: extensions/tmlr_integration/manuscript
        run: |
          mkdir -p "$RUNNER_TEMP/kahm-mechanism-tex"
          latexmk -pdf -interaction=nonstopmode -halt-on-error -output-directory="$RUNNER_TEMP/kahm-mechanism-tex" main.tex
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          source = Path('main.tex').read_text()
          tmlr_options = re.findall(r'\\usepackage(?:\[([^\]]*)\])?\{tmlr\}', source)
          if tmlr_options != ['']:
              raise SystemExit('The submission must use the default anonymous TMLR review style')
          if not re.search(r'\\author\s*\{\s*Anonymous authors\s*\}', source):
              raise SystemExit('The submission author field is not anonymous')
          if not re.search(r'pdfauthor\s*=\s*\{\s*Anonymous authors\s*\}', source):
              raise SystemExit('The PDF author metadata is not anonymous')
          output = Path(os.environ['RUNNER_TEMP']) / 'kahm-mechanism-tex'
          log = (output / 'main.log').read_text()
          if re.search(r'There were undefined (references|citations)|(?:LaTeX|Package natbib) Warning:.*undefined|Overfull \\[hv]box', log):
              raise SystemExit('Unresolved references/citations or overflowing manuscript content')
          if not (output / 'main.pdf').is_file():
              raise SystemExit('Compiled manuscript is missing')
          PY
      - name: Build the anonymous saved-forecast supplement
        run: >-
          python extensions/tmlr_integration/package_tmlr_review.py
          --output-dir "$RUNNER_TEMP/kahm-tmlr-review"
      - name: Verify the extracted anonymous supplement
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          import sys
          import zipfile
          temporary = Path(os.environ['RUNNER_TEMP'])
          archive_path = temporary / 'kahm-tmlr-review' / 'KAHM_TMLR_Saved_Forecasts.zip'
          if archive_path.stat().st_size >= 100_000_000:
              raise SystemExit('The anonymous supplement exceeds the 100 MB limit')
          extracted = temporary / 'kahm-tmlr-review-extracted'
          extracted.mkdir()
          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('The anonymous archive contains duplicate paths')
              for entry in archive.infolist():
                  path = PurePosixPath(entry.filename)
                  if (path.is_absolute() or '..' in path.parts
                          or path.parts[0] != 'saved_forecast_supplement'
                          or (entry.external_attr >> 16) & 0o170000 == 0o120000):
                      raise SystemExit('The anonymous archive contains an unsafe path')
              if archive.testzip() is not None:
                  raise SystemExit('The anonymous archive failed its CRC check')
              archive.extractall(extracted)
          verifier = extracted / 'saved_forecast_supplement' / 'verify_saved_forecasts.py'
          subprocess.run([sys.executable, str(verifier), '--write-results',
                          str(temporary / 'kahm-tmlr-review-recomputed')], check=True)
          PYCODE
      - name: Package the manuscript, editable source and complete experiment evidence
        run: >-
          python -m extensions.reconstruction_mechanism.package_results build
          --pdf "$RUNNER_TEMP/kahm-mechanism-tex/main.pdf"
          --output "$RUNNER_TEMP/kahm-mechanism-release"
      - name: Validate archives and replay the extracted experimental states
        run: |
          python -m extensions.reconstruction_mechanism.package_results verify "$RUNNER_TEMP/kahm-mechanism-release"
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import zipfile
          temporary = Path(os.environ['RUNNER_TEMP'])
          release = temporary / 'kahm-mechanism-release'
          source = temporary / 'kahm-mechanism-source'
          reproduction = temporary / 'kahm-mechanism-reproduction'
          for filename, destination in [
              ('KAHM_Reconstruction_Prediction_Manuscript_Source.zip', source),
              ('KAHM_Reconstruction_Mechanism_Reproduction.zip', reproduction)]:
              destination.mkdir()
              # The preceding verifier rejects unsafe names, links and duplicates.
              with zipfile.ZipFile(release / filename) as archive:
                  archive.extractall(destination)
          subprocess.run([sys.executable, '-m', 'extensions.reconstruction_mechanism.run', 'replay'],
                         cwd=reproduction, check=True)
          # Compile source independently; no forecasting experiment is required.
          compiled = temporary / 'kahm-mechanism-source-tex'
          compiled.mkdir()
          subprocess.run(['latexmk', '-pdf', '-interaction=nonstopmode', '-halt-on-error',
                          '-output-directory=' + str(compiled), 'main.tex'], cwd=source, check=True)
          original = subprocess.check_output(['pdftotext', str(release / 'KAHM_Reconstruction_Prediction_Manuscript.pdf'), '-'])
          rebuilt = subprocess.check_output(['pdftotext', str(compiled / 'main.pdf'), '-'])
          if original.split() != rebuilt.split():
              raise SystemExit('Extracted source does not reproduce the supplied manuscript text')
          PY
      - name: Upload the manuscript, source and reproduction archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kahm-tmlr-manuscript-and-reproduction
          path: |
            ${{ runner.temp }}/kahm-mechanism-release/*
            ${{ runner.temp }}/kahm-tmlr-review/KAHM_TMLR_Saved_Forecasts.zip
            ${{ runner.temp }}/kahm-tmlr-review/PACKAGE_SUMMARY.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
