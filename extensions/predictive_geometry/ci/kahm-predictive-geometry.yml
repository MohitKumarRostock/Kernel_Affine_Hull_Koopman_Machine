# Install at the repository root: .github/workflows/kahm-predictive-geometry.yml
name: KAHM predictive geometry reproduction

on:
  push:
    branches: [research/kahm-predictive-geometry, research/tmlr-predictive-geometry]
    paths:
      - 'extensions/predictive_geometry/**'
      - '.github/workflows/kahm-predictive-geometry.yml'
  pull_request:
    paths:
      - 'extensions/predictive_geometry/**'
      - '.github/workflows/kahm-predictive-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/predictive_geometry
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: extensions/predictive_geometry/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m reproduce smoke --run-dir runs/ci-smoke
      - run: python -m reproduce review-diagnostics --output runs/ci-diagnostics
      - run: python -m reproduce submission --output-dir dist/tmlr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kahm-reproduction-smoke
          path: |
            extensions/predictive_geometry/runs/ci-smoke/execution_manifest.json
            extensions/predictive_geometry/runs/ci-smoke/smoke_work/smoke_results.json
            extensions/predictive_geometry/runs/ci-smoke/audit_work/archive_audit.json
            extensions/predictive_geometry/runs/ci-smoke/paper_assets/
            extensions/predictive_geometry/runs/ci-diagnostics/
            extensions/predictive_geometry/dist/tmlr/
