name: Supporting forecasting checks
'on':
  push:
    branches:
    - archive/pre-manuscript-cleanup-2026-11-02
    paths: &id001
    - extensions/predictive_geometry/**
    - extensions/dimension_forecasting/**
    - extensions/preprocessing_dimension/**
    - extensions/crossfit_residual_reproduction_20261101/**
    - extensions/crossfit_residual_v2/**
    - extensions/policy_augmentation_20261101/**
    - extensions/policy_augmentation_natural_20261101/**
    - extensions/soft_state_ablation_20261102/**
    - extensions/score_enrichment_20261102/**
    - extensions/reconstruction_mechanism/analyze.py
    - scripts/verify_study_sources.py
    - reproduction/audits/local_position_forecasting/**
    - .github/workflows/kahm-predictive-geometry.yml
  pull_request:
    paths: *id001
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/predictive_geometry
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.14
        cache: pip
        cache-dependency-path: extensions/predictive_geometry/requirements.txt
    - name: Verify frozen study sources and shared dependencies
      working-directory: ${{ github.workspace }}
      run: python scripts/verify_study_sources.py
    - run: python -m pip install -r requirements.txt
    - name: Recompute central summary and local-position contrasts
      working-directory: ${{ github.workspace }}
      run: 'python extensions/score_enrichment_20261102/verify_primary_summary.py

        python reproduction/audits/local_position_forecasting/verify_primary.py --evidence extensions/soft_state_ablation_20261102/analysis
        --output "$RUNNER_TEMP/local_position_verification.json"

        '
    - run: python -m reproduce smoke --run-dir runs/ci-smoke
    - run: python -m reproduce review-diagnostics --output runs/ci-diagnostics
    - name: Check that recorded files are unchanged
      working-directory: ${{ github.workspace }}
      run: git diff --exit-code
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kahm-reproduction-smoke
        path: 'extensions/predictive_geometry/runs/ci-smoke/execution_manifest.json

          extensions/predictive_geometry/runs/ci-smoke/smoke_work/smoke_results.json

          extensions/predictive_geometry/runs/ci-smoke/audit_work/archive_audit.json

          extensions/predictive_geometry/runs/ci-smoke/paper_assets/

          extensions/predictive_geometry/runs/ci-diagnostics/

          '
