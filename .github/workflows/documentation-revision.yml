name: Verify scientific documentation revision

on:
  push:
    branches:
      - maintenance/risk-documentation-2026-11-17
    paths:
      - .maintenance/rewrite_documentation.py
      - .github/workflows/documentation-revision.yml

permissions:
  contents: write

jobs:
  documentation-and-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - name: Check out the isolated documentation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: maintenance/risk-documentation-2026-11-17
          fetch-depth: 1
      - name: Set up the recorded Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the unchanged experiment dependencies
        run: python -m pip install -r requirements.txt
      - name: Revise documentation and verify scientific-file integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.maintenance/rewrite_documentation.py')
          s=p.read_text()
          s=s.replace('specified additional-cost criterion','specified comparison criterion')
          s=s.replace('The class-diagnosis package also checks its local manifest.', 'Experiment packages also verify their local manifests where supplied.')
          start=s.index('# Update only the documentation entry in the package-local manifest.')
          end=s.index('\nunchanged=0',start)
          replacement='''# Update only entries identifying revised documentation in package manifests.
          updated_manifests=set()
          for directory in sorted((ROOT/'experiments').iterdir()):
              if not directory.is_dir():
                  continue
              for filename in ('manifest.json','MANIFEST.json'):
                  local=directory/filename
                  if not local.is_file():
                      continue
                  m=json.loads(local.read_text())
                  changed=False
                  if isinstance(m.get('sha256'),dict):
                      for name,value in list(m['sha256'].items()):
                          target=local.parent/name
                          relative=str(target.relative_to(ROOT))
                          if relative in DOCS:
                              m['sha256'][name]=digest(target)
                              changed=True
                  if isinstance(m.get('files'),dict):
                      for name,row in m['files'].items():
                          target=local.parent/name
                          relative=str(target.relative_to(ROOT))
                          if relative in DOCS:
                              if not isinstance(row,dict) or 'sha256' not in row:
                                  raise RuntimeError('Unsupported documentation checksum: '+str(local))
                              row['sha256']=digest(target)
                              if 'bytes' in row:
                                  row['bytes']=target.stat().st_size
                              changed=True
                  if isinstance(m.get('files'),list):
                      for row in m['files']:
                          target=local.parent/row['path']
                          relative=str(target.relative_to(ROOT))
                          if relative in DOCS:
                              row['sha256']=digest(target)
                              if 'bytes' in row:
                                  row['bytes']=target.stat().st_size
                              changed=True
                  if changed:
                      local.write_text(json.dumps(m,indent=2)+'\\n')
                      updated_manifests.add(str(local.relative_to(ROOT)))
          allowed=set(DOCS)|updated_manifests
          '''
          s=s[:start]+replacement+s[end:]
          s=s.replace("'root_and_class_diagnosis_manifests_updated':True,", "'root_manifest_updated':True, 'package_manifests_updated':sorted(updated_manifests),")
          p.write_text(s)
          PY
          python .maintenance/rewrite_documentation.py
      - name: Recompute all six experiment groups
        run: |
          if ! python reproduce.py --output "$RUNNER_TEMP/risk-documentation-reproduction"; then
            find "$RUNNER_TEMP/risk-documentation-reproduction" -name '*.log' -type f -exec sh -c 'echo "=== $1 ==="; tail -n 100 "$1"' _ {} \;
            exit 1
          fi
      - name: Verify the worked example and command-line help
        run: |
          python scripts/explain_bike_certificate.py --json > "$RUNNER_TEMP/risk-documentation-example.json"
          python reproduce.py --help
      - name: Record validation and remove one-time editing tools
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'risk-documentation-reproduction'
          report=json.loads((src/'summary.json').read_text())
          expected={'controlled_calibration','ecg_cohort','class_diagnosis','deployment_cost','public_screening','decoder_diagnostics'}
          assert report['status']=='PASS'
          assert set(report['groups'])==expected
          assert all(v['status']=='PASS' for v in report['groups'].values())
          audit=Path('validation/documentation_audit.json')
          data=json.loads(audit.read_text())
          assert report['source_manifest']['sha256']==data['source_manifest_sha256']
          data['numerical_reproduction_status']='PASS'
          data['validated_groups']=sorted(expected)
          data['worked_example_completed']=True
          shutil.copytree(src,Path('validation'),dirs_exist_ok=True)
          audit.write_text(json.dumps(data,indent=2)+'\n')
          PY
          git rm -f .maintenance/rewrite_documentation.py .github/workflows/documentation-revision.yml
          git add -u
          git add validation/documentation_audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use precise scientific terminology in paper documentation; verify all six groups'
          remote_head=$(git ls-remote origin refs/heads/maintenance/risk-documentation-2026-11-17 | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/maintenance/risk-documentation-2026-11-17
